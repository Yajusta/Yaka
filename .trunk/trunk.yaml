# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - bandit@1.9.4
    - black@26.5.1
    - checkov@3.3.16
    - git-diff-check
    - hadolint@2.15.1
    - isort@9.0.1
    - markdownlint@0.49.1
    - osv-scanner@2.5.1
    - oxipng@10.2.0
    - prettier@3.9.6
    - ruff@0.16.5
    - svgo@4.1.0
    - taplo@0.10.0
    - trufflehog@3.97.1
    - yamllint@1.38.0
  disabled:
    # Redondant avec osv-scanner (mêmes advisories) et sort en erreur ici.
    - grype
  ignore:
    # bandit est un scanner de sécurité applicative : le code de test utilise
    # légitimement `assert` (B101) et des mots de passe factices (B105/B106).
    - linters: [bandit]
      paths:
        - backend/tests/**
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
