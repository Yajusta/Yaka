# En-têtes de sécurité, inclus dans le bloc server ET dans chaque location qui
# déclare ses propres add_header (nginx ne les cumule pas avec ceux du niveau
# supérieur). __API_ORIGIN__ est remplacé au démarrage par docker-entrypoint.sh
# (origine de API_BASE_URL).
#
# CSP :
# - script-src : 'wasm-unsafe-eval' et blob: pour la reconnaissance vocale
#   Whisper (desktop) : onnxruntime-web compile du WebAssembly et importe sa
#   fabrique depuis une URL blob:. Aucun script inline (index.html n'en a pas).
# - style-src 'unsafe-inline' : balises <style> injectées par Radix
#   (react-remove-scroll), sonner, etc.
# - connect-src : l'API, plus les modèles Whisper (huggingface.co et ses CDN
#   *.hf.co) et le runtime ONNX (cdn.jsdelivr.net), en lecture seule.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' __API_ORIGIN__ https://huggingface.co https://*.huggingface.co https://*.hf.co https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# Les jetons d'invitation et de réinitialisation passent en query string
add_header Referrer-Policy "no-referrer" always;
# Micro conservé pour la commande vocale
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
