server {
    # Port non privilégié : le conteneur tourne sous l'utilisateur nginx
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Généré au démarrage par docker-entrypoint.sh (voir nginx-security-headers.conf)
    include /etc/nginx/yaka/security-headers.conf;

    # Gérer les routes SPA (rediriger toutes les requêtes vers index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Activer la compression pour optimiser les performances
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Configuration générée au démarrage du conteneur, service worker de la PWA
    # et son script d'enregistrement (leur mise à jour ne doit pas rester
    # bloquée dans un cache, navigateur ou CDN) : jamais en cache. Avant la
    # règle des fichiers statiques, les regex étant testées dans l'ordre.
    location ~ /(api-config|demo-config|sw|registerSW)\.js$ {
        include /etc/nginx/yaka/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Ajouter des en-têtes de cache pour les fichiers statiques
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        include /etc/nginx/yaka/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public";
    }
}
